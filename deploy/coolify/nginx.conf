worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    # All writable paths are usable by the unprivileged nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        # Revalidate after deployment rather than mixing old HTML/JS with new WASM.
        add_header Cache-Control "no-cache" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ \.wasm$ {
            types { application/wasm wasm; }
            try_files $uri =404;
        }

        location / {
            # Missing JS/WASM must be 404, not a misleading HTML fallback.
            try_files $uri $uri/ =404;
        }
    }
}
